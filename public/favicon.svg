<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <rect width="100" height="100" rx="22" fill="#0d0e15"/>
  <rect x="2" y="2" width="96" height="96" rx="20" stroke="url(#borderGlow)" stroke-width="2"/>
  
  <!-- Outer glowing inverted A / triangle -->
  <path d="M22 24 L50 82 L78 24 L64 24 L50 56 L36 24 Z" fill="url(#mainGrad)" filter="url(#glow)"/>
  <!-- Crossbar connecting the arms -->
  <path d="M30 46 L70 46 L65 57 L35 57 Z" fill="url(#barGrad)"/>
  <!-- Inner inverted triangle cutout -->
  <polygon points="50,70 38,46 62,46" fill="#0d0e15"/>
  
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="mainGrad" x1="22" y1="24" x2="78" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#818cf8"/>
      <stop offset="80%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="30" y1="46" x2="70" y2="57" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="borderGlow" x1="0" y1="0" x2="100" y2="100">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
</svg>